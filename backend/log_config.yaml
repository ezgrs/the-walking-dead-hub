version: 1
disable_existing_loggers: false

formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    fmt: '%(levelprefix)s %(message)s'
    use_colors: null

  access:
    "()": uvicorn.logging.AccessFormatter
    fmt: '%(levelprefix)s %(asctime)s %(status_code)s - %(request_line)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr

  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout

loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: false

  uvicorn.error:
    level: INFO

  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: false

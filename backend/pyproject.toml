[project]
name = "the-walking-dead-hub"
version = "0.1.0"
description = ""
authors = [
    {name = "Enzo Santos",email = "enzo.santos29@hotmail.com"}
]
requires-python = ">=3.13,<4"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "pytest-playwright (>=0.7.2,<0.8.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "aiopath (>=0.7.7,<0.8.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "fastapi[standard] (==0.115.14)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "alembic (>=1.18.4,<2.0.0)"
]

[tool.poetry]
package-mode = false
packages = [{include = "twd_hub"}]

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.44.0"
pyright = "^1.1.408"
ruff = "^0.15.10"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
ruff_check = "ruff check twd_hub --fix"
ruff_format = "ruff format twd_hub --line-length 80"
format = ["ruff_check", "ruff_format"]
serve = "uvicorn --factory twd_hub.api.app:create_app --port 5000 --reload --log-config log_config.yaml"
tests_format = "ruff format tests --line-length 80"
tests_run = "pytest --cov=twd_hub --cov-report=html tests/"
